<!DOCTYPE html>
<html>
<head>
    <title>Tower Defense Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <p>Gold: <span id="gold">100</span></p>
        <button id="tower1-btn">Build Tower 1 (10 gold)</button>
        <button id="tower2-btn">Build Tower 2 (20 gold)</button>
        <button id="tower3-btn">Build Tower 3 (30 gold)</button>
        <button id="upgrade-btn">Upgrade Selected Tower (10-50 gold)</button>
    </div>

    <script>
        // Get the canvas and context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Define some constants
        const TOWER_SIZE = 50;
        const ENEMY_SIZE = 30;
        const BULLET_SIZE = 10;
        const TOWER1_COST = 10;
        const TOWER2_COST = 20;
        const TOWER3_COST = 30;
        const UPGRADE_COST = 10;

        // Define some variables
        let gold = 100;
        let towers = [];
        let enemies = [];
        let bullets = [];
        let selectedTower = null;
        let wave = 1;
        let enemyCount = 0;

        // Define the tower types
        class Tower {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.level = 1;
                this.range = 100;
                this.damage = 10;
            }

            draw() {
                ctx.fillStyle = 'blue';
                ctx.fillRect(this.x, this.y, TOWER_SIZE, TOWER_SIZE);
            }

            upgrade() {
                if (this.level < 3) {
                    this.level++;
                    this.range += 20;
                    this.damage += 5;
                }
            }
        }

        class Tower1 extends Tower {
            constructor(x, y) {
                super(x, y, 'tower1');
            }
        }

        class Tower2 extends Tower {
            constructor(x, y) {
                super(x, y, 'tower2');
            }
        }

        class Tower3 extends Tower {
            constructor(x, y) {
                super(x, y, 'tower3');
            }
        }

        // Define the enemy types
        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.health = 100;
            }

            draw() {
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x, this.y, ENEMY_SIZE, ENEMY_SIZE);
            }

            update() {
                this.x += 2;
                if (this.x > canvas.width) {
                    this.x = -ENEMY_SIZE;
                    this.y = Math.random() * (canvas.height - ENEMY_SIZE);
                }
            }
        }

        class Enemy1 extends Enemy {
            constructor(x, y) {
                super(x, y, 'enemy1');
            }
        }

        class Enemy2 extends Enemy {
            constructor(x, y) {
                super(x, y, 'enemy2');
            }
        }

        // Define the bullet
        class Bullet {
            constructor(x, y, target) {
                this.x = x;
                this.y = y;
                this.target = target;
            }

            draw() {
                ctx.fillStyle = 'green';
                ctx.fillRect(this.x, this.y, BULLET_SIZE, BULLET_SIZE);
            }

            update() {
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 10) {
                        this.target.health -= 10;
                        this.target = null;
                    } else {
                        this.x += dx / dist * 5;
                        this.y += dy / dist * 5;
                    }
                }
            }
        }

        // Handle tower building
        document.getElementById('tower1-btn').addEventListener('click', () => {
            if (gold >= TOWER1_COST) {
                gold -= TOWER1_COST;
                document.getElementById('gold').textContent = gold;
                towers.push(new Tower1(Math.random() * (canvas.width - TOWER_SIZE), Math.random() * (canvas.height - TOWER_SIZE)));
            }
        });

        document.getElementById('tower2-btn').addEventListener('click', () => {
            if (gold >= TOWER2_COST) {
                gold -= TOWER2_COST;
                document.getElementById('gold').textContent = gold;
                towers.push(new Tower2(Math.random() * (canvas.width - TOWER_SIZE), Math.random() * (canvas.height - TOWER_SIZE)));
            }
        });

        document.getElementById('tower3-btn').addEventListener('click', () => {
            if (gold >= TOWER3_COST) {
                gold -= TOWER3_COST;
                document.getElementById('gold').textContent = gold;
                towers.push(new Tower3(Math.random() * (canvas.width - TOWER_SIZE), Math.random() * (canvas.height - TOWER_SIZE)));
            }
        });

        // Handle tower upgrading
        document.getElementById('upgrade-btn').addEventListener('click', () => {
            if (selectedTower && gold >= UPGRADE_COST) {
                gold -= UPGRADE_COST;
                document.getElementById('gold').textContent = gold;
                selectedTower.upgrade();
            }
        });

        // Handle tower selection
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            for (let tower of towers) {
                if (x >= tower.x && x <= tower.x + TOWER_SIZE && y >= tower.y && y <= tower.y + TOWER_SIZE) {
                    selectedTower = tower;
                }
            }
        });

        // Main loop
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update enemies
            for (let enemy of enemies) {
                enemy.update();
                enemy.draw();
                if (enemy.health <= 0) {
                    enemies.splice(enemies.indexOf(enemy), 1);
                    gold += 10;
                    document.getElementById('gold').textContent = gold;
                }
            }

            // Update bullets
            for (let bullet of bullets) {
                bullet.update();
                bullet.draw();
                if (!bullet.target) {
                    bullets.splice(bullets.indexOf(bullet), 1);
                }
            }

            // Update towers
            for (let tower of towers) {
                tower.draw();
                for (let enemy of enemies) {
                    const dx = enemy.x - tower.x;
                    const dy = enemy.y - tower.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < tower.range) {
                        bullets.push(new Bullet(tower.x, tower.y, enemy));
                    }
                }
            }

            // Spawn enemies
            if (wave <= 10 && enemies.length < 10) {
                if (enemies.length < wave) {
                    enemies.push(new Enemy1(Math.random() * -100, Math.random() * (canvas.height - ENEMY_SIZE)));
                    enemies.push(new Enemy2(Math.random() * -100, Math.random() * (canvas.height - ENEMY_SIZE)));
                }
            }

            // Increase wave
            if (enemies.length === 0 && wave <= 10) {
                wave++;
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
